<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Poker Bank</title>
<style>
:root{--felt1:#12864f;--felt2:#0a5a39;--felt3:#052f1f;--panel:rgba(3,26,17,.80);--line:rgba(230,184,74,.32);--gold:#e6b84a;--gold2:#f6d57a;--txt:#f3efe2;--mut:#9fbfae;--win:#7dffb0;--loss:#ff8a94;--warn:#ffd36b;--ink:#05241a}
*{box-sizing:border-box}
body{margin:0;color:var(--txt);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#052f1f radial-gradient(ellipse 130% 70% at 50% 0%,var(--felt1) 0%,var(--felt2) 45%,var(--felt3) 100%) no-repeat;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 90px}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}

/* hero */
.hero{position:relative;height:200px;overflow:hidden;border-radius:18px;margin-bottom:12px;border:2px solid var(--gold);background:linear-gradient(135deg,#0d6b43,#053a25);box-shadow:inset 0 0 40px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.35)}
.hero-txt{position:absolute;left:16px;top:18px;z-index:2}
.logo{font-size:32px;line-height:1;font-weight:900;letter-spacing:.1em;color:var(--gold);background:linear-gradient(#fff3c4,#e6b84a 60%,#b98a22);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none}
.tag{margin-top:10px;font-size:15px;font-weight:700;font-style:italic;color:var(--gold2);max-width:170px}
.girl{position:absolute;right:0;bottom:0;height:200px;width:auto;z-index:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));pointer-events:none;user-select:none}
button,select,.hcard,.linkbtn{cursor:pointer}
.chip{position:absolute;width:42px;height:42px;border-radius:50%;z-index:3;background:repeating-conic-gradient(#f7f1df 0 14deg,var(--c) 14deg 45deg);box-shadow:0 3px 6px rgba(0,0,0,.5);animation:float 5s ease-in-out infinite}
.chip::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--c);border:2px solid rgba(255,255,255,.6)}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(10deg)}}
@media (prefers-reduced-motion:reduce){.chip{animation:none}}

.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--mut);border-radius:12px;font-size:15px;font-weight:600}
.tabs button.on{color:#2a1d00;border-color:var(--gold);background:linear-gradient(#f6d57a,#e6b84a)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;background:var(--ink);color:var(--txt);border:1px solid rgba(230,184,74,.25);border-radius:10px;padding:10px;font-size:16px}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--mut);margin-top:6px}
.player{padding-top:8px}
.player:not(:first-child) label{display:none}
.prow{display:grid;grid-template-columns:1fr 76px 104px 34px;gap:6px;align-items:end}
.x{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;height:42px;font-size:18px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(#f6d57a,#e6b84a);color:#2a1d00;font-size:16px;font-weight:700;margin-top:10px}
.btn.sec{background:rgba(255,255,255,.08);color:var(--txt);font-weight:500;border:1px solid var(--line)}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;margin:0}
.banner{border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px;border:1px solid}
.banner.ok{border-color:#2f8f5c;background:rgba(18,80,50,.75);color:var(--win)}
.banner.bad{border-color:#a33a45;background:rgba(90,20,28,.8);color:var(--loss)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--mut);text-align:right;font-size:12px;padding:4px 0}
td{padding:8px 0;border-top:1px solid rgba(230,184,74,.18);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
.win{color:var(--win)}.loss{color:var(--loss)}
.big{font-size:20px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hcard{cursor:pointer}
.hdet{display:none;margin-top:10px}
.hcard.open .hdet{display:block}
.mut{color:var(--mut)}
.hidden{display:none}
.linkbtn{background:none;border:0;color:var(--gold2);font-size:13px;text-decoration:underline;padding:0}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.hidden{display:none}
.mbox{background:#0a3a26;border:1px solid var(--gold);border-radius:16px;padding:18px;max-width:380px;width:100%}
.mbtns{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:linear-gradient(#f6d57a,#e6b84a);color:#2a1d00;font-weight:700;padding:13px 22px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%;font-size:16px;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<script id="logic">
// ---- Pure calc logic (tested separately) ----
const GAP_TOL = 100000; // VND: gaps above this are red, at or below are green
function roundTo(x, step) {
  if (!step || step <= 1) return Math.round(x);
  const s = x < 0 ? -1 : 1;
  return s * Math.round(Math.abs(x) / step) * step;
}
function isActive(p) {
  return String(p.name || '').trim() !== '' || (p.final !== '' && p.final != null) || (+p.topups || 0) > 0;
}
function gapLevel(gapVND, gapChips) {
  if (Math.abs(gapChips) < 0.5) return 'exact';
  return Math.abs(gapVND) > GAP_TOL ? 'bad' : 'tol';
}
function calcGame(settings, players) {
  const buyin = +settings.buyin || 0, chips0 = +settings.chips || 0;
  const topup = +settings.topup || 0, step = +settings.step || 1;
  const chipValue = chips0 > 0 ? buyin / chips0 : 0;
  const topupChips = chipValue > 0 ? topup / chipValue : 0;
  let totalIn = 0, totalFinal = 0, sumNet = 0, sumRaw = 0;
  const rows = players.map((p, idx) => {
    if (!isActive(p)) return { idx, active: false, name: '', topups: 0, final: 0, invested: 0, chipsIn: 0, gross: 0, raw: 0, net: 0 };
    const n = Math.max(0, +p.topups || 0);
    const fin = +p.final || 0;
    const invested = buyin + n * topup;
    const chipsIn = chips0 + n * topupChips;
    const gross = fin * chipValue;
    const raw = gross - invested;
    const net = roundTo(raw, step);
    totalIn += chipsIn; totalFinal += fin; sumNet += net; sumRaw += raw;
    return { idx, active: true, name: p.name || '', topups: n, final: fin, invested, chipsIn, gross, raw, net };
  });
  const gapChips = totalFinal - totalIn;
  return { chipValue, topupChips, rows, totalIn, totalFinal, gapChips,
           gapVND: gapChips * chipValue, sumNet, sumRaw };
}
</script>

<script>
const LS_CUR = 'pokerbank.current.v1', LS_HIST = 'pokerbank.history.v1', N_ROWS = 10;
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('en-US');
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
const cls = n => n > 0 ? 'win' : n < 0 ? 'loss' : '';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

// storage that never throws (some embedded previews block localStorage)
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };

// in-page dialog + toast (confirm()/alert() are blocked in some embedded views)
function ask(msg, okText) {
  return new Promise(res => {
    $('mmsg').textContent = msg; $('myes').textContent = okText || 'OK';
    $('modal').classList.remove('hidden');
    const done = v => { $('modal').classList.add('hidden'); $('myes').onclick = $('mno').onclick = null; res(v); };
    $('myes').onclick = () => done(true); $('mno').onclick = () => done(false);
  });
}
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

const blank = () => ({ name: '', topups: 0, final: '' });
const blankPlayers = () => Array.from({ length: N_ROWS }, blank);
const examplePlayers = () => { const p = blankPlayers(); p[0] = { name: 'Player A', topups: 0, final: 2980 }; return p; };
const defaults = { buyin: 500000, chips: 1000, topup: 500000, step: '1000', date: today(), type: 'cash' };

let state = { settings: { ...defaults }, players: examplePlayers() };
try {
  const s = JSON.parse(lsGet(LS_CUR));
  if (s && Array.isArray(s.players)) { state = { settings: { ...defaults, ...s.settings }, players: s.players }; }
} catch (e) {}
while (state.players.length < N_ROWS) state.players.push(blank());
let history = [];
try { history = JSON.parse(lsGet(LS_HIST)) || []; } catch (e) {}
let lastSig = null;

const persist = () => lsSet(LS_CUR, JSON.stringify(state));
const persistHist = () => lsSet(LS_HIST, JSON.stringify(history));

// ---- settings wiring ----
const S = state.settings;
[['buyin','buyin'],['chips','chips'],['topup','topup'],['step','step'],['date','gdate']].forEach(([k, id]) => {
  const el = $(id); el.value = S[k];
  el.addEventListener('input', () => { S[k] = el.value; update(); });
});
$('gtype').value = S.type || 'cash';

// ---- players ----
function renderPlayers() {
  const box = $('players'); box.innerHTML = '';
  state.players.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'player';
    d.innerHTML = `<div class="prow">
      <div><label>Name</label><input data-k="name" list="names" placeholder="Player ${i + 1}" value="${esc(p.name)}"></div>
      <div><label>Top-ups</label><input data-k="topups" type="number" inputmode="numeric" min="0" placeholder="0" value="${p.topups}"></div>
      <div><label>Final chips</label><input data-k="final" type="number" inputmode="numeric" min="0" placeholder="0" value="${p.final}"></div>
      <button class="x" aria-label="Remove row">×</button></div>
      <div class="hint" data-sub></div>`;
    d.querySelectorAll('input').forEach(inp => inp.addEventListener('input', () => { p[inp.dataset.k] = inp.value; update(); }));
    d.querySelector('.x').onclick = () => { if (state.players.length > 1) { state.players.splice(i, 1); renderPlayers(); update(); } };
    box.appendChild(d);
  });
}
$('addp').onclick = () => { state.players.push(blank()); renderPlayers(); update(); };
$('loadex').onclick = () => { state.players = examplePlayers(); renderPlayers(); update(); toast('Example loaded ✓'); };

// ---- main update ----
function update() {
  const c = calcGame(S, state.players);
  $('cvhint').textContent = c.chipValue ? `1 chip = ${c.chipValue.toLocaleString('en-US', { maximumFractionDigits: 4 })} VND · a top-up = ${fmt(c.topupChips)} chips` : 'Enter buy-in and starting chips.';

  document.querySelectorAll('#players .player').forEach((d, i) => {
    const r = c.rows[i]; const sub = d.querySelector('[data-sub]'); if (!r) return;
    sub.innerHTML = r.active ? `Invested ${fmt(r.invested)} · chips in ${fmt(r.chipsIn)} · net <b class="${cls(r.net)}">${sgn(r.net)}</b>` : '';
  });

  const act = c.rows.filter(r => r.active);
  const b = $('banner');
  if (!act.length) b.innerHTML = '';
  else {
    const lvl = gapLevel(c.gapVND, c.gapChips);
    const dir = c.gapChips > 0 ? 'over' : 'short';
    const gap = `${dir} by ${fmt(Math.abs(c.gapChips))} chips (${fmt(Math.abs(c.gapVND))} VND)`;
    if (lvl === 'exact') b.innerHTML = `<div class="banner ok">✓ Chips balance: ${fmt(c.totalFinal)} out = ${fmt(c.totalIn)} in.</div>`;
    else if (lvl === 'tol') b.innerHTML = `<div class="banner ok"><b>Mismatch, but small: ${gap}.</b><br>Within the ${fmt(GAP_TOL)} VND tolerance.</div>`;
    else b.innerHTML = `<div class="banner bad"><b>Chip mismatch: ${gap}.</b><br>Final ${fmt(c.totalFinal)} vs issued ${fmt(c.totalIn)}. Above the ${fmt(GAP_TOL)} VND tolerance, so recount.</div>`;
  }

  const named = act.map(r => ({ ...r, name: r.name || `Player ${r.idx + 1}` }));
  if (!named.length) { $('results').innerHTML = '<h2>Net P&amp;L</h2><div class="mut">Enter a name or final chips for each player at the table.</div>'; persist(); return; }
  const winners = named.filter(r => r.net > 0), losers = named.filter(r => r.net < 0);
  const collect = losers.reduce((a, r) => a - r.net, 0), pay = winners.reduce((a, r) => a + r.net, 0);
  let h = `<h2>Net P&amp;L</h2><table><tr><th>Player</th><th>Invested</th><th>Cash-out</th><th>Net</th></tr>`;
  named.forEach(r => { h += `<tr><td>${esc(r.name)}</td><td>${fmt(r.invested)}</td><td>${fmt(r.gross)}</td><td class="${cls(r.net)}"><b>${sgn(r.net)}</b></td></tr>`; });
  h += `<tr><td><b>Total</b></td><td>${fmt(named.reduce((a, r) => a + r.invested, 0))}</td><td>${fmt(named.reduce((a, r) => a + r.gross, 0))}</td><td class="${cls(c.sumNet)}">${sgn(c.sumNet)}</td></tr></table>`;
  h += `<div class="hint">Net = final chips × chip value − (buy-in + top-ups), rounded to ${fmt(+S.step || 1)} VND per player.</div>`;
  h += `<h2 style="margin-top:16px">You (the bank)</h2>
    <div class="row"><span>Collect from ${losers.length} loser${losers.length === 1 ? '' : 's'}</span><span class="big loss">${fmt(collect)}</span></div>
    <div class="row"><span>Pay out to ${winners.length} winner${winners.length === 1 ? '' : 's'}</span><span class="big win">${fmt(pay)}</span></div>
    <div class="row mut" style="margin-top:6px"><span>Bank left over (chip gap + rounding)</span><span>${sgn(collect - pay)}</span></div>`;
  $('results').innerHTML = h;
  persist();
}

// ---- save / new game ----
async function saveGame() {
  const c = calcGame(S, state.players);
  const act = c.rows.filter(r => r.active);
  if (!act.length) return toast('Nothing to save yet.');
  const sig = JSON.stringify([S, state.players]);
  if (sig === lastSig) return toast('This game is already saved.');
  const lvl = gapLevel(c.gapVND, c.gapChips);
  if (lvl === 'bad' && !(await ask(`Chips are off by ${fmt(Math.abs(c.gapChips))} (${fmt(Math.abs(c.gapVND))} VND), above the ${fmt(GAP_TOL)} tolerance. Save anyway?`, 'Save anyway'))) return;
  history.unshift({ id: Date.now(), date: S.date, settings: { ...S }, gapChips: c.gapChips, gapVND: c.gapVND, chipValue: c.chipValue,
    players: act.map(r => ({ name: r.name || `Player ${r.idx + 1}`, topups: r.topups, final: r.final, invested: r.invested, gross: r.gross, net: r.net })) });
  const ok = persistHist(); lastSig = sig; renderHist();
  toast(ok ? 'Game saved ✓' : 'Game saved (this session only: browser storage is blocked here)');
}
async function newGame() {
  const act = calcGame(S, state.players).rows.some(r => r.active);
  const unsaved = act && JSON.stringify([S, state.players]) !== lastSig;
  if (!(await ask(`Start a new game? This clears names, top-ups and final chips (table setup stays).${unsaved ? ' This game is NOT saved yet.' : ''}`, 'Start new'))) return;
  state.players = blankPlayers(); S.date = today(); $('gdate').value = S.date; lastSig = null;
  renderPlayers(); update(); toast('Game refreshed ✓');
}
$('save').onclick = saveGame; $('newgame').onclick = newGame;

// ---- history ----
const gapOf = g => g.gapVND != null ? g.gapVND : (g.gapChips || 0) * (g.chipValue || 0);
function renderHist() {
  const names = [...new Set(history.flatMap(g => g.players.map(p => p.name)))];
  $('names').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
  const tot = {};
  history.forEach(g => g.players.forEach(p => { const t = tot[p.name] || (tot[p.name] = { games: 0, net: 0 }); t.games++; t.net += p.net; }));
  const arr = Object.entries(tot).sort((a, b) => b[1].net - a[1].net);
  $('alltime').innerHTML = arr.length ? `<table><tr><th>Player</th><th>Games</th><th>Net</th></tr>${arr.map(([n, t]) => `<tr><td>${esc(n)}</td><td>${t.games}</td><td class="${cls(t.net)}"><b>${sgn(t.net)}</b></td></tr>`).join('')}</table>` : '<div class="mut">No games saved yet.</div>';
  $('hlist').innerHTML = history.map((g, gi) => {
    const top = [...g.players].sort((a, b) => b.net - a.net)[0];
    const lvl = gapLevel(gapOf(g), g.gapChips || 0);
    const flag = lvl === 'exact' ? '' : ` · <span class="${lvl === 'bad' ? 'loss' : 'win'}">gap ${fmt(Math.abs(gapOf(g)))} VND</span>`;
    return `<div class="card hcard" data-i="${gi}">
      <div class="row"><b>${esc(g.date)}</b><span class="mut">${g.players.length} players · ${fmt(g.settings.buyin)} buy-in${flag}</span></div>
      <div class="mut" style="font-size:13px">Top: ${esc(top.name)} <span class="${cls(top.net)}">${sgn(top.net)}</span></div>
      <div class="hdet"><table><tr><th>Player</th><th>Top-ups</th><th>Final chips</th><th>Net</th></tr>
      ${g.players.map(p => `<tr><td>${esc(p.name)}</td><td>${p.topups}</td><td>${fmt(p.final)}</td><td class="${cls(p.net)}"><b>${sgn(p.net)}</b></td></tr>`).join('')}</table>
      <div class="hint">1 chip = ${(+g.chipValue).toLocaleString('en-US', { maximumFractionDigits: 4 })} VND · rounded to ${fmt(g.settings.step)}</div>
      <button class="btn sec sm del" style="margin-top:10px">Delete</button></div></div>`;
  }).join('');
  document.querySelectorAll('.hcard').forEach(el => el.addEventListener('click', async e => {
    if (e.target.classList.contains('del')) {
      if (await ask('Delete this game from history?', 'Delete')) { history.splice(+el.dataset.i, 1); lastSig = null; persistHist(); renderHist(); toast('Deleted'); }
      return;
    }
    el.classList.toggle('open');
  }));
}
$('exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' }));
  a.download = `poker-bank-${today()}.json`; a.click();
};
$('imp').onclick = () => $('impf').click();
$('impf').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(async t => { try { const d = JSON.parse(t); if (!Array.isArray(d)) throw 0;
    if (await ask(`Replace current history with ${d.length} games from file?`, 'Replace')) { history = d; persistHist(); renderHist(); toast('Imported'); }
  } catch (_) { toast('Not a valid backup file.'); } });
};

// ---- tabs ----
function tab(t) {
  $('view-game').classList.toggle('hidden', t !== 'game'); $('view-hist').classList.toggle('hidden', t !== 'hist');
  $('tab-game').classList.toggle('on', t === 'game'); $('tab-hist').classList.toggle('on', t === 'hist');
}
$('tab-game').onclick = () => tab('game'); $('tab-hist').onclick = () => tab('hist');

renderPlayers(); renderHist(); update();
</script>
</body>
</html>
